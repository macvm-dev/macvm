[workspace]
resolver = "3"
members = ["crates/protocol", "crates/platform", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes",
    "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis",
    "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_System_Registry", "Wdk_Graphics_Direct3D",
] }
macvm-agent-protocol = { path = "crates/protocol" }
macvm-agent-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
