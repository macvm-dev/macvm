[workspace]
resolver = "3"
members = ["agent", "agent-platform", "agent-protocol", "boot"]
# macvm-boot 只能编到 aarch64-unknown-uefi，不进宿主上的 cargo build/test。
default-members = ["agent", "agent-platform", "agent-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes",
    "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis",
    "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Graphics_Gdi", "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
    "Wdk_Graphics_Direct3D",
] }
macvm-agent-protocol = { path = "agent-protocol" }
macvm-agent-platform = { path = "agent-platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
