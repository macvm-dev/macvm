[workspace]
resolver = "3"
members = ["agent", "agent-platform", "agent-protocol", "boot"]
# macvm-boot 只能编到 aarch64-unknown-uefi，不进宿主上的 cargo build/test。
default-members = ["agent", "agent-platform", "agent-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_JobObjects",
    "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_IO",
    "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops",
    "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis",
    "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Graphics_Gdi", "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Wdk_Graphics_Direct3D",
] }
# UI Automation、Shell 与 OLE 拖放是 COM 接口，windows-sys 不带 COM 包装。
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant",
    "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common",
] }
# `windows::core::implement` 展开后直接引用 windows_core。
windows-core = "0.62"
png = "0.18"
macvm-agent-protocol = { path = "agent-protocol" }
macvm-agent-platform = { path = "agent-platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
