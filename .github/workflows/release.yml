name: Release

# 推送 v* 标签时构建、签名、公证 App 与 DMG 并发布到 GitHub Releases；手动运行时只构建，产物作为 artifact 上传。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # 自带的 QEMU 要求与构建机相同的 macOS，用 macOS 27 加 Xcode 27 的镜像。
    runs-on: xcode-27
    # 首次编译 QEMU 图形栈（含 LLVM）很久，之后走缓存。
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - name: 版本号
        id: version
        run: |
          plist_version=$(plutil -extract CFBundleShortVersionString raw packaging/Info.plist)
          cargo_version=$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version = "([^"]*)"/\1/p' guest/Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 标签要打在把版本号改成它的提交上（make tag），发布出去的与仓库里的版本号、构建号一致。
            version=${GITHUB_REF_NAME#v}
            [ "$plist_version" = "$version" ] && [ "$cargo_version" = "$version" ] || {
              echo "${GITHUB_REF_NAME} 所在提交的版本号是 ${plist_version}（Info.plist）、${cargo_version}（guest/Cargo.toml），与标签不符；用 make tag VERSION=${version} 发版" >&2
              exit 1
            }
          else
            version=$plist_version-dev
            # 客户机程序的 Cargo 版本号要求完整的 x.y.z。
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "版本号须为 x.y.z：$version" >&2; exit 1; }
            plutil -replace CFBundleShortVersionString -string "$version" packaging/Info.plist
            sed -i '' -E "/^\[workspace\.package\]/,/^\[/ s/^version = \"[^\"]*\"/version = \"$version\"/" guest/Cargo.toml
            grep -q "^version = \"$version\"" guest/Cargo.toml || { echo "没能改写客户机程序的版本号" >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 安装构建依赖
        run: |
          brew install cmake ninja meson pkgconf glib pixman openssl python libslirp
          xcodebuild -downloadComponent MetalToolchain
          rustup toolchain install stable --profile minimal
          cargo install --locked cargo-xwin@0.23.1

      - name: 检查与测试
        env:
          MACVM_HOME: ${{ runner.temp }}/macvm-home
        run: |
          make lint lint-guest test-guest
          # 配置构建测试要找 UEFI 引导程序。
          make boot
          make test-swift

      - name: 恢复 QEMU 缓存
        uses: actions/cache/restore@v6
        with:
          path: .build/qemu
          key: qemu-xcode27-${{ hashFiles('scripts/build-qemu.sh', 'qemu/**') }}
          restore-keys: qemu-xcode27-
      - name: 编译 QEMU
        id: qemu
        run: make qemu
      # QEMU 编得久，后续步骤失败也先存下来。
      - name: 保存 QEMU 缓存
        if: always() && steps.qemu.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .build/qemu
          key: qemu-xcode27-${{ hashFiles('scripts/build-qemu.sh', 'qemu/**') }}-${{ github.run_id }}

      - name: 编译客户机代理、引导程序与 App
        run: |
          make agent boot
          make build CONFIG=release

      # 证书与公证凭据只给签名与公证用：放到所有拉取、编译第三方代码的步骤之后再导入，那些代码就拿不到解锁的签名身份。
      - name: 导入签名证书与公证凭据
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/release.keychain-db
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          password=$(uuidgen)
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" >/dev/null
          # App Store Connect API 密钥：接受 .p8 原文（换行可被压成空格或 \n）、它的 base64，或不带 PEM 头尾的密钥正文。
          key="$RUNNER_TEMP/notary-key.p8"
          python3 - "$key" <<'EOF'
          import base64, binascii, os, re, sys, textwrap
          secret = os.environ["NOTARY_KEY_P8"]

          def pem_body(text):
              """返回密钥正文（DER 的 base64），认不出时返回 None。"""
              text = text.replace("\\n", "\n").replace("\r", "").strip().strip('"').strip("'")
              match = re.search(r"-----BEGIN [A-Z ]+-----(.*?)-----END [A-Z ]+-----", text, re.S)
              if match:
                  return re.sub(r"\s", "", match.group(1))
              compact = re.sub(r"\s", "", text)
              for decode in (base64.b64decode, base64.urlsafe_b64decode):
                  try:
                      data = decode(compact + "=" * (-len(compact) % 4))
                  except (binascii.Error, ValueError):
                      continue
                  try:
                      inner = pem_body(data.decode())
                      if inner:
                          return inner
                  except UnicodeDecodeError:
                      pass
                  # 解出二进制：PKCS#8 DER 以 SEQUENCE（0x30）开头，即不带头尾的正文。
                  if data[:1] == b"\x30":
                      return base64.b64encode(data).decode()
              return None

          body = pem_body(secret)
          if not body:
              odd = sorted({c for c in secret if not (c.isalnum() or c in "+/=-_ \n\r\t")})
              sys.exit(f"NOTARY_KEY_P8 不是有效的 .p8 密钥：长度 {len(secret)}，{secret.count(chr(10)) + 1} 行，"
                       f"{'含' if 'BEGIN' in secret else '不含'} PEM 头，非 base64 字符 {odd}")
          with open(sys.argv[1], "w") as f:
              f.write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          EOF
          xcrun notarytool store-credentials macvm --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$KEYCHAIN"
          rm "$key"

      - name: 构建、签名并公证
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: make release SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: 打包
        id: package
        run: |
          dmg=dist/MacVM-${{ steps.version.outputs.version }}.dmg
          mv dist/MacVM.dmg "$dmg"
          (cd dist && shasum -a 256 "$(basename "$dmg")") > "$dmg.sha256"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      # Sparkle 的 appcast 作为发布资源上传：App 的 SUFeedURL 经 releases/latest/download 取最新正式版的那份，资源名不能改。
      # 发布说明同时用作 GitHub Release 的正文与 Sparkle 更新窗口里的说明。
      - name: 生成发布说明与 appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "缺少 secret SPARKLE_PRIVATE_KEY" >&2; exit 1; }
          dmg=${{ steps.package.outputs.dmg }}
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > dist/release-notes.md
          feed=$RUNNER_TEMP/appcast
          mkdir -p "$feed"
          cp "$dmg" "$feed/"
          cp dist/release-notes.md "$feed/$(basename "$dmg" .dmg).md"
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
            --embed-release-notes --maximum-deltas 0 \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases" "$feed"
          cp "$feed/appcast.xml" dist/appcast.xml

      - name: 上传 artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: MacVM-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.version.outputs.version }}
          # 只有比现有最新版高的正式版才标为最新：SUFeedURL 取最新版的 appcast，构建号又按发布先后递增，
          # 预发布版或给旧版本补发的修订成了最新版，已装的 App 会经 appcast 更新（或降级）到它。
          latest=(--latest)
          current=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [[ "$version" == *-* ]]; then
            latest=(--prerelease --latest=false)
          elif [ -n "$current" ] && [ "$(printf '%s\n' "${current#v}" "$version" | sort -V | tail -1)" != "$version" ]; then
            latest=(--latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${latest[@]}" --notes-file dist/release-notes.md --title "MacVM $version" \
            "${{ steps.package.outputs.dmg }}" "${{ steps.package.outputs.dmg }}.sha256" dist/appcast.xml

      - name: 清理钥匙串
        if: always()
        run: '[ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN"'
