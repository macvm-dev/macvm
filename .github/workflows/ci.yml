name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift
    # 引擎用到 macOS 27 SDK 的 API，用带 Xcode 27 的镜像。
    runs-on: xcode-27
    env:
      MACVM_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'
      - run: swift --version
      - uses: actions/cache@v6
        with:
          path: .build
          key: swiftpm-xcode27-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: swiftpm-xcode27-${{ hashFiles('Package.resolved', 'Package.swift') }}-
      - run: make lint
      - run: make build
      # 配置构建测试要找 UEFI 引导程序。
      - run: rustup toolchain install stable --profile minimal
      - run: make boot
      - run: make test-swift

  guest:
    name: Guest (Rust)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guest
      - run: make lint-guest
      - run: make test-guest
