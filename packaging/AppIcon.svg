<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C5CF0"/>
      <stop offset="0.55" stop-color="#2A2F8F"/>
      <stop offset="1" stop-color="#14163F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0F9F8F"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#E8860C"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E8FA"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- 底板 -->
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.18"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <g clip-path="url(#body)">
    <!-- 最后一层窗口 -->
    <rect x="322" y="262" width="520" height="400" rx="48" fill="#000000" fill-opacity="0.22"/>
    <rect x="316" y="248" width="520" height="400" rx="48" fill="url(#teal)"/>
    <circle cx="364" cy="282" r="11" fill="#FFFFFF" fill-opacity="0.75"/>
    <circle cx="400" cy="282" r="11" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="436" cy="282" r="11" fill="#FFFFFF" fill-opacity="0.3"/>

    <!-- 中间一层窗口 -->
    <rect x="258" y="326" width="520" height="400" rx="48" fill="#000000" fill-opacity="0.22"/>
    <rect x="252" y="312" width="520" height="400" rx="48" fill="url(#amber)"/>
    <circle cx="300" cy="346" r="11" fill="#FFFFFF" fill-opacity="0.75"/>
    <circle cx="336" cy="346" r="11" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="372" cy="346" r="11" fill="#FFFFFF" fill-opacity="0.3"/>

    <!-- 最前一层窗口 -->
    <rect x="194" y="394" width="520" height="400" rx="48" fill="#000000" fill-opacity="0.28"/>
    <rect x="188" y="376" width="520" height="400" rx="48" fill="url(#front)"/>
    <path d="M236 376 H660 A48 48 0 0 1 708 424 V444 H188 V424 A48 48 0 0 1 236 376 Z" fill="#D5DCF5"/>
    <circle cx="236" cy="410" r="12" fill="#FF6159"/>
    <circle cx="274" cy="410" r="12" fill="#FFBD2E"/>
    <circle cx="312" cy="410" r="12" fill="#28C941"/>

    <!-- 提示符 -->
    <path d="M276 528 L356 588 L276 648" fill="none" stroke="#3341C9" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M400 652 H520" fill="none" stroke="#3341C9" stroke-width="40" stroke-linecap="round"/>
  </g>
</svg>
